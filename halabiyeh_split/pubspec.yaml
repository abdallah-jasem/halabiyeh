name: halabiyeh_split
description: "Split a group bill: items, shares, service and tip, who pays whom."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  google_fonts: ^8.2.1
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.12.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
